# LOCAL TEMPLATE ONLY: copy this file to .github/workflows/android-smoke-132.yml
# in the PUBLIC victorJorques/RWAdar-downloads repository after review.
# Never copy private application source, environment files or signing keys.
# This public APK's identity is fixed below. Unknown/mismatched builds fail closed.
# QA ONLY: this workflow has no release job or contents write permission.
# A separate android-release-132.yml requires a completed QA run and explicit
# confirmation that its own screenshots and exact evidence have been reviewed.
name: RWAdar 1.3.2 - Android emulator QA only
run-name: RWAdar 1.3.2 APK16 native QA
on:
  push:
    branches: [codex/android-132-release]
    paths: [.github/workflows/android-smoke-132.yml]
  workflow_dispatch:
    inputs:
      apk_url:
        description: Exact anonymous EAS APK16 URL (HTTPS)
        required: true
        type: string
      apk_sha256:
        description: Exact SHA256 of the APK 1.3.2 code16
        required: true
        type: string
      apk_bytes:
        description: Exact byte size of that APK
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rwadar-apk16-release
  cancel-in-progress: false
env:
  # Exact metadata of the final EAS APK verified locally by the coordinating agent.
  # If a retry increments the versionCode, stop: this workflow requires code16.
  APK_URL: ${{ inputs.apk_url || 'https://expo.dev/artifacts/eas/tXOv6yjJzj71MReCmcRunqCqo_lK4sEwkZQpGV7vOLY.apk' }}
  APK_SHA256: ${{ inputs.apk_sha256 || '998d0aed3b183b8f045c36e2772421da806e0e0996e5513de8549ccc13f3fdf9' }}
  APK_BYTES: ${{ inputs.apk_bytes || '88777561' }}
  PUBLICAR_RELEASE: 'NO'
  CERT_SHA256: f506dea70ad644184161542d583455d2ad849c4dea3fffa0469c9ca400f58b72
  RELEASE_TAG: v1.3.2
jobs:
  android:
    # Standard public-repository runner, not a paid larger runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      apk_url: ${{ steps.identity.outputs.apk_url }}
      apk_sha256: ${{ steps.identity.outputs.apk_sha256 }}
      apk_bytes: ${{ steps.identity.outputs.apk_bytes }}
      evidence_sha256: ${{ steps.evidence.outputs.evidence_sha256 }}
      evidence_bytes: ${{ steps.evidence.outputs.evidence_bytes }}
    env:
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      HEAD_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Download the exact public APK and verify identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = victorJorques/RWAdar-downloads
          test "$GITHUB_REF" = refs/heads/codex/android-132-release
          test "$PUBLICAR_RELEASE" = NO
          [[ "$APK_SHA256" != 6b137a5adcbcb0a9c4ced483846d612cef3f04fd5bb0865fa5ce36483a630d55 ]]
          mkdir -p evidence
          [[ "$APK_URL" == https://expo.dev/artifacts/eas/*.apk ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_SHA256" != 593099b7c23d420da0aa361d74d4760b6e73368089849a57887489e7cfb1a255 ]]
          [[ "$APK_SHA256" != 816f07a6d8563ebfb601be6810b564e6ebaeb49f865226ce2112f7635032884b ]]
          [[ "$APK_BYTES" =~ ^[1-9][0-9]{6,8}$ ]]
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --retry 2 "$APK_URL" -o rwadar.apk
          test "$(stat -c '%s' rwadar.apk)" = "$APK_BYTES"
          printf '%s  rwadar.apk\n' "$APK_SHA256" | sha256sum --check
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs rwadar.apk > evidence/signature.txt
          test "$(grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest:' evidence/signature.txt)" = 1
          grep -Fx "Signer #1 certificate SHA-256 digest: $CERT_SHA256" evidence/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging rwadar.apk > evidence/package.txt
          grep -F "package: name='com.rwadar.app' versionCode='16' versionName='1.3.2'" evidence/package.txt
          grep -Fx "sdkVersion:'24'" evidence/package.txt
          grep -Fx "targetSdkVersion:'36'" evidence/package.txt
          test "$(grep -c '^uses-permission:' evidence/package.txt)" = 4
          if grep -q '^uses-permission-sdk-' evidence/package.txt; then exit 1; fi
          grep '^uses-permission:' evidence/package.txt | grep -Ev "name='(android.permission.(INTERNET|ACCESS_NETWORK_STATE|VIBRATE)|com.rwadar.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)'" > evidence/unexpected-permissions.txt || true
          test ! -s evidence/unexpected-permissions.txt
          if grep -Eq "uses-permission:.*(SYSTEM_ALERT_WINDOW|RECEIVE_BOOT_COMPLETED|USE_BIOMETRIC|USE_FINGERPRINT|POST_NOTIFICATIONS|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)" evidence/package.txt; then
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree rwadar.apk AndroidManifest.xml > evidence/manifest.txt
          python3 - <<'PY'
          import pathlib, re
          manifest = pathlib.Path('evidence/manifest.txt').read_text(encoding='utf-8')
          assert re.search(r'android:allowBackup\([^)]*\)=\(type 0x12\)0x0\b', manifest), 'Backup must remain disabled'
          assert re.search(r'expo\.modules\.updates\.ENABLED[\s\S]{0,240}android:value\([^)]*\)=\(type 0x12\)0x0\b', manifest), 'Expo OTA must remain disabled'
          assert not re.search(r'android:(debuggable|usesCleartextTraffic)\([^)]*\)=\(type 0x12\)0xffffffff\b', manifest), 'No debug or cleartext-enabled APK'
          badging = pathlib.Path('evidence/package.txt').read_text(encoding='utf-8')
          permissions = re.findall(r"^uses-permission(?:-sdk-\d+)?: name='([^']+)'", badging, re.MULTILINE)
          expected = {'android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE',
                      'android.permission.VIBRATE', 'com.rwadar.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'}
          assert len(permissions) == 4 and set(permissions) == expected, 'Unexpected or duplicate manifest permissions'
          PY
          printf 'apk_url=%s\napk_sha256=%s\napk_bytes=%s\npublicar_release=%s\n' "$APK_URL" "$APK_SHA256" "$APK_BYTES" "$PUBLICAR_RELEASE" >> "$GITHUB_OUTPUT"
      - name: Prepare official Android emulator on an ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          printf '%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/rwadar-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          test -c /dev/kvm
          # Narrow grant on this disposable runner only; no account permission changes.
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          # Uses the runner's existing accepted SDK licences. Never auto-accept new terms.
          timeout 300 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'emulator' 'system-images;android-35;default;x86_64' < /dev/null
          command -v adb
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n rwadar_smoke -k 'system-images;android-35;default;x86_64' --device pixel_6 --path "$ANDROID_AVD_HOME/rwadar_smoke.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee evidence/avds.txt
          grep -Fx 'rwadar_smoke' evidence/avds.txt
          "$ANDROID_HOME/emulator/emulator" -avd rwadar_smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 2048 > evidence/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install --no-streaming rwadar.apk
      - name: Compile a disposable UI snapshot test harness, never modify the product APK
        shell: bash
        run: |
          set -euo pipefail
          # Stock uiautomator dump waits for idle and can leave a stale file on animated screens.
          # Use the documented Instrumentation/UiAutomation APIs to read the current tree directly.
          # This helper has no activity, network permission, product code, credentials or private key.
          mkdir -p ui-helper/classes ui-helper/dex
          python3 - <<'PY'
          from pathlib import Path
          Path('ui-helper/AndroidManifest.xml').write_text('''<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rwadar.smoketest">
            <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="35"/>
            <application android:label="RWAdar CI snapshot" android:allowBackup="false"/>
            <instrumentation android:name="com.rwadar.smoketest.DumpRunner" android:targetPackage="com.rwadar.smoketest"/>
          </manifest>''', encoding='utf-8')
          Path('ui-helper/DumpRunner.java').write_text(r'''package com.rwadar.smoketest;
          import android.app.Instrumentation;
          import android.app.UiAutomation;
          import android.graphics.Rect;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.util.Xml;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.io.StringWriter;
          import org.xmlpull.v1.XmlSerializer;
          public final class DumpRunner extends Instrumentation {
            @Override public void onCreate(Bundle args) { super.onCreate(args); start(); }
            private static String value(CharSequence value) { return value == null ? "" : value.toString(); }
            private static void node(XmlSerializer xml, AccessibilityNodeInfo info, int depth) throws Exception {
              if (depth > 100) throw new IllegalStateException("Hierarchy too deep");
              Rect bounds = new Rect(); info.getBoundsInScreen(bounds);
              xml.startTag(null, "node");
              xml.attribute(null, "text", value(info.getText()));
              xml.attribute(null, "content-desc", value(info.getContentDescription()));
              xml.attribute(null, "package", value(info.getPackageName()));
              xml.attribute(null, "class", value(info.getClassName()));
              xml.attribute(null, "clickable", Boolean.toString(info.isClickable()));
              xml.attribute(null, "enabled", Boolean.toString(info.isEnabled()));
              xml.attribute(null, "password", Boolean.toString(info.isPassword()));
              xml.attribute(null, "checkable", Boolean.toString(info.isCheckable()));
              xml.attribute(null, "checked", Boolean.toString(info.isChecked()));
              xml.attribute(null, "visible", Boolean.toString(info.isVisibleToUser()));
              xml.attribute(null, "bounds", "["+bounds.left+","+bounds.top+"]["+bounds.right+","+bounds.bottom+"]");
              for (int i=0; i<info.getChildCount(); i++) {
                AccessibilityNodeInfo child = info.getChild(i);
                if (child != null) { node(xml, child, depth+1); child.recycle(); }
              }
              xml.endTag(null, "node");
            }
            @Override public void onStart() {
              Bundle result = new Bundle();
              try {
                UiAutomation automation = getUiAutomation();
                AccessibilityNodeInfo root = null;
                long deadline = SystemClock.uptimeMillis()+5000;
                while (root == null && SystemClock.uptimeMillis() < deadline) {
                  root = automation.getRootInActiveWindow();
                  if (root == null) SystemClock.sleep(100);
                }
                if (root == null) throw new IllegalStateException("No active UI root");
                StringWriter writer = new StringWriter(); XmlSerializer xml = Xml.newSerializer();
                xml.setOutput(writer); xml.startDocument("UTF-8", true);
                xml.startTag(null, "hierarchy"); node(xml, root, 0); xml.endTag(null, "hierarchy");
                xml.endDocument(); root.recycle();
                result.putString("rwadar_ui", writer.toString()); finish(-1, result);
              } catch (Throwable error) {
                result.putString("rwadar_error", error.toString()); finish(1, result);
              }
            }
          }''', encoding='utf-8')
          PY
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          javac --release 8 -classpath "$ANDROID_JAR" -d ui-helper/classes ui-helper/DumpRunner.java
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 24 --output ui-helper/dex ui-helper/classes/com/rwadar/smoketest/DumpRunner.class
          "$BUILD_TOOLS/aapt" package -f -M ui-helper/AndroidManifest.xml -I "$ANDROID_JAR" -F ui-helper/unsigned.apk
          zip -j ui-helper/unsigned.apk ui-helper/dex/classes.dex
          "$BUILD_TOOLS/zipalign" -f 4 ui-helper/unsigned.apk ui-helper/aligned.apk
          keytool -genkeypair -keystore ui-helper/ephemeral.jks -storepass android -keypass android -alias test -dname 'CN=Disposable CI test only' -keyalg RSA -validity 1 -noprompt
          "$BUILD_TOOLS/apksigner" sign --ks ui-helper/ephemeral.jks --ks-pass pass:android --key-pass pass:android --out ui-helper/test.apk ui-helper/aligned.apk
          adb install --no-streaming ui-helper/test.apk
      - name: Verify public catalog, local favorite and optional account forms without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time, xml.etree.ElementTree as ET
          
          out = pathlib.Path('evidence')
          
          
          class TransientSnapshotError(Exception):
              pass
          
          
          def adb(*args, timeout=20):
              return subprocess.run(['adb', *args], check=True, capture_output=True, timeout=timeout).stdout.decode('utf-8', errors='replace')
          
          
          def dump_once(timeout=30):
              raw = adb('shell', 'am', 'instrument', '-w', '-r', 'com.rwadar.smoketest/.DumpRunner', timeout=timeout)
              out.joinpath('latest-ui-instrumentation.txt').write_text(raw, encoding='utf-8')
              marker = 'INSTRUMENTATION_RESULT: rwadar_ui='
              if marker not in raw and 'No active UI root' in raw:
                  raise TransientSnapshotError('UiAutomation has no active root during a window transition')
              assert marker in raw, 'Fresh UI snapshot failed: ' + raw[-1200:]
              xml = raw.split(marker, 1)[1].split('\nINSTRUMENTATION_', 1)[0].strip()
              root = ET.fromstring(xml)
              out.joinpath('latest-ui.xml').write_text(xml, encoding='utf-8')
              return root
          
          
          def dump(timeout=30):
              deadline = time.monotonic() + timeout
              while True:
                  try:
                      return dump_once(timeout=max(.1, deadline - time.monotonic()))
                  except TransientSnapshotError as error:
                      with out.joinpath('snapshot-errors.log').open('a', encoding='utf-8') as log:
                          log.write(str(error) + '\n')
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise
                      time.sleep(min(2, remaining))
          
          
          def visible_text(root):
              return '\n'.join(value for node in root.iter('node') if node.get('visible') != 'false' for value in [node.get('text', ''), node.get('content-desc', '')] if value)
          
          
          def wait_ui(*texts, timeout=75):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  try:
                      root = dump(timeout=min(30, max(.1, deadline - time.monotonic())))
                      if all(text in visible_text(root) for text in texts):
                          return root
                  except (subprocess.SubprocessError, ET.ParseError, TransientSnapshotError) as error:
                      with out.joinpath('snapshot-errors.log').open('a', encoding='utf-8') as log:
                          log.write(str(error) + '\n')
                  time.sleep(2)
              raise AssertionError('Native UI did not visibly show: ' + ', '.join(texts))
          
          
          def screen(name, root=None):
              image = subprocess.run(['adb', 'exec-out', 'screencap', '-p'], check=True, capture_output=True, timeout=20).stdout
              assert image.startswith(b'\x89PNG'), 'Screenshot must be a real PNG'
              out.joinpath(name + '.png').write_bytes(image)
              if root is not None:
                  out.joinpath(name + '.xml').write_text(ET.tostring(root, encoding='unicode'), encoding='utf-8')
          
          
          def find_node(root, label, starts=False):
              candidates = []
              for node in root.iter('node'):
                  values = [node.get('content-desc', ''), node.get('text', '')]
                  if node.get('visible') != 'false' and any(v.startswith(label) if starts else v == label for v in values):
                      candidates.append(node)
              candidates.sort(key=lambda n: n.get('clickable') != 'true')
              for node in candidates:
                  bounds = list(map(int, re.findall(r'-?\d+', node.get('bounds', ''))))
                  if len(bounds) == 4 and bounds[2] > bounds[0] and bounds[3] > bounds[1]:
                      return node, bounds
              raise AssertionError('Accessible control not found: ' + label)
          
          
          def tap_observed(root, label, starts=False):
              node, bounds = find_node(root, label, starts)
              adb('shell', 'input', 'tap', str((bounds[0]+bounds[2])//2), str((bounds[1]+bounds[3])//2))
              return node
          
          
          def scroll_down():
              size = re.search(r'Physical size:\s*(\d+)x(\d+)', adb('shell', 'wm', 'size'))
              assert size, 'Need actual device dimensions for scrolling'
              width, height = map(int, size.groups())
              adb('shell', 'input', 'swipe', str(width//2), str(int(height*.80)), str(width//2), str(int(height*.32)), '450')
              time.sleep(.5)
          
          
          def document_detail(prefix, title, required, forbidden=(), inspect=None, scan_to_end=False):
              root = wait_ui('Cerrar ' + title)
              remaining = set(required)
              previous_text = None
              for index in range(40):
                  root = dump()
                  text = visible_text(root)
                  if inspect:
                      inspect(root)
                  assert not any(item in text for item in forbidden), 'Commercial claim in documentary detail: ' + text
                  newly = {item for item in remaining if item in text}
                  if newly or index == 0:
                      screen(prefix + '-%02d' % index, root)
                  remaining -= newly
                  if not remaining and (not scan_to_end or text == previous_text):
                      if scan_to_end:
                          screen(prefix + '-complete', root)
                      return root
                  previous_text = text
                  scroll_down()
              raise AssertionError('Missing visible documentary evidence: ' + ', '.join(sorted(remaining)))
          
          
          def search(root, query):
              # Reset through the actual accessible native control; do not rely
              # on a stale tree, keyboard shortcuts, or an unobserved coordinate.
              scroll_top()
              root = dump()
              try:
                  find_node(root, 'Limpiar búsqueda y filtros de ofertas')
              except AssertionError:
                  pass
              else:
                  tap_observed(root, 'Limpiar búsqueda y filtros de ofertas')
                  time.sleep(.5)
                  root = wait_ui('Ofertas específicas')
              tap_observed(root, 'Buscar ofertas por nombre, proveedor, país o métrica')
              adb('shell', 'input', 'text', query.replace(' ', '%s'))
              adb('shell', 'input', 'keyevent', 'KEYCODE_BACK')
              return wait_ui(query, '1 ficha')
          
          
          def assert_counts(root):
              text = visible_text(root)
              match = re.search(r'(\d+) principales · (\d+) secundarias · (\d+) en camino', text)
              assert match, 'Missing explicit V2 collection counts: ' + text
              counts = tuple(map(int, match.groups()))
              assert counts == (24, 21, 4), 'Partial or unexpected V2 catalog: ' + str(counts)
              assert '28 fichas' not in text and 'fixture local' not in text and 'copia sin conexión' not in text, 'Old/local/offline catalog must not pass'
              return {'principales': counts[0], 'secundario': counts[1], 'en_camino': counts[2]}


          def scroll_top():
              size = re.search(r'Physical size:\s*(\d+)x(\d+)', adb('shell', 'wm', 'size'))
              assert size, 'Need actual screen dimensions'
              width, height = map(int, size.groups())
              previous = None
              for _ in range(12):
                  current = visible_text(dump())
                  if current == previous:
                      return
                  previous = current
                  adb('shell', 'input', 'swipe', str(width//2), str(int(height*.32)), str(width//2), str(int(height*.80)), '350')
                  time.sleep(.3)
          
          
          def reach_control(label, starts=False):
              previous = None
              for _ in range(14):
                  root = dump()
                  try:
                      find_node(root, label, starts=starts)
                      return root
                  except AssertionError:
                      current = visible_text(root)
                      if current == previous:
                          break
                      previous = current
                      scroll_down()
              raise AssertionError('Control not reachable by native scrolling: ' + label)
          
          
          def assert_empty_field(root, label, password=False):
              candidates = [n for n in root.iter('node')
                            if n.get('visible') != 'false'
                            and n.get('class', '').endswith('EditText')
                            and n.get('content-desc') == label]
              assert candidates, 'Accessible native input missing: ' + label
              for field in candidates:
                  assert not field.get('text', ''), 'Smoke must never enter credentials or personal data'
                  assert field.get('enabled') == 'true', 'Input must be usable: ' + label
                  assert field.get('password') == str(password).lower(), 'Password masking mismatch: ' + label
          
          
          # Public, non-secret expectations from the approved editorial-v2 assets.
          # Card locations and detail alt text must identify the new per-offer
          # photo; a generic category fallback deliberately fails this QA.
          editorial_samples = [
            {
              "query": "Spiko",
              "title": "Spiko Letras del Tesoro Euro",
              "slug": "spiko-letras-del-tesoro-euro",
              "group": "principales",
              "location": "Zona euro",
              "alt": "Ilustración editorial de un edificio ministerial neoclásico genérico, como imagen de un fondo que compra letras del Tesoro de la zona euro, imagen generada con IA. Pasos: compras participaciones; el fondo compra letras; pides el reembolso. No es una foto del activo real."
            },
            {
              "query": "Outeiro",
              "title": "Casa de Outeiro",
              "slug": "casa-de-outeiro",
              "group": "principales",
              "location": "Ribeira Sacra · Lugo",
              "alt": "Ilustración editorial de una casa solariega de piedra restaurada entre viñedos en terrazas sobre un cañón fluvial de la Ribeira Sacra, parecida a la real, imagen generada con IA. Pasos: suscribes la ampliación; recibes tus acciones; socio de bodega y hotel. No es una foto del activo real."
            },
            {
              "query": "Prosegur",
              "title": "Prosegur Digital Gold",
              "slug": "prosegur-digital-gold",
              "group": "principales",
              "location": "Custodia en España",
              "alt": "Ilustración editorial de unos lingotes de oro sin marcas en una cámara acorazada, imagen generada con IA. Pasos: compras gramos de oro; se guarda en una cámara; vendes y cobras en euros. No es una foto del activo real."
            },
            {
              "query": "GreenPoint",
              "title": "Fotovoltaica GreenPoint",
              "slug": "fotovoltaica-greenpoint",
              "group": "principales",
              "location": "Wiener Neustadt · Austria",
              "alt": "Ilustración editorial de unos paneles solares en la cubierta de un edificio de oficinas de una ciudad austriaca, imagen generada con IA. Pasos: compras participaciones; los paneles dan energía; reparto del excedente. No es una foto del activo real."
            },
            {
              "query": "Houston 3",
              "title": "Houston 3",
              "slug": "reental-secundario-houston-3",
              "group": "secundario",
              "location": "Houston · EE. UU.",
              "alt": "Ilustración editorial de una hilera de casas estrechas de tres plantas con garaje en Houston, parecida a la real, imagen generada con IA. Pasos: compras si hay oferta; la casa se alquila; reparto o reventa. No es una foto del activo real."
            }
          ]
          editorial_checked = []


          def editorial_detail(sample, prefix):
              root = wait_ui('Cerrar ' + sample['title'])
              root = reach_control(sample['alt'])
              assert 'Sin ilustración editorial disponible' not in visible_text(root)
