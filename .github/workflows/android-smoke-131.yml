# LOCAL TEMPLATE ONLY: copy this file to .github/workflows/android-smoke-131.yml
# in the PUBLIC victorJorques/RWAdar-downloads repository after review.
# Never copy private application source, environment files or signing keys.
# This public APK's identity is fixed below. Unknown/mismatched builds fail closed.
# PUBLICAR_RELEASE defaults to NO. Change it to SI only with current human
# authorisation and after reviewing the candidate's hash, size and signature.
name: RWAdar 1.3.1 - Android emulator QA then optional public release
run-name: RWAdar 1.3.1 APK14 native QA
on:
  push:
    branches: [codex/android-131-release]
    paths: [.github/workflows/android-smoke-131.yml]
  workflow_dispatch:
    inputs:
      apk_url:
        description: Exact anonymous EAS APK14 URL (HTTPS)
        required: true
        type: string
      apk_sha256:
        description: Exact SHA256 of the APK 1.3.1 code14
        required: true
        type: string
      apk_bytes:
        description: Exact byte size of that APK
        required: true
        type: string
      publicar_release:
        description: Publish v1.3.1 only AFTER native QA passes and current human approval
        required: true
        default: 'NO'
        type: choice
        options: ['NO', 'SI']
permissions:
  contents: read
concurrency:
  group: rwadar-apk14-release
  cancel-in-progress: false
env:
  # Exact metadata of the final EAS APK verified locally by the coordinating agent.
  # If a retry increments the versionCode, stop: this workflow requires code14.
  APK_URL: ${{ inputs.apk_url || 'https://expo.dev/artifacts/eas/anPjkJQG3PrtSwghAMRtXVxPSWb8q3ahqRS31z_xVVw.apk' }}
  APK_SHA256: ${{ inputs.apk_sha256 || '6b137a5adcbcb0a9c4ced483846d612cef3f04fd5bb0865fa5ce36483a630d55' }}
  APK_BYTES: ${{ inputs.apk_bytes || '85622508' }}
  # One approved revision; restore NO after verified public release.
  PUBLICAR_RELEASE: ${{ inputs.publicar_release || 'NO' }}
  CERT_SHA256: f506dea70ad644184161542d583455d2ad849c4dea3fffa0469c9ca400f58b72
  RELEASE_TAG: v1.3.1
jobs:
  android:
    # Standard public-repository runner, not a paid larger runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      apk_url: ${{ steps.identity.outputs.apk_url }}
      apk_sha256: ${{ steps.identity.outputs.apk_sha256 }}
      apk_bytes: ${{ steps.identity.outputs.apk_bytes }}
      publicar_release: ${{ steps.identity.outputs.publicar_release }}
      evidence_sha256: ${{ steps.evidence.outputs.evidence_sha256 }}
      evidence_bytes: ${{ steps.evidence.outputs.evidence_bytes }}
    env:
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      HEAD_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Download the exact public APK and verify identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = victorJorques/RWAdar-downloads
          test "$GITHUB_REF" = refs/heads/codex/android-131-release
          [[ "$PUBLICAR_RELEASE" == NO || "$PUBLICAR_RELEASE" == SI ]]
          mkdir -p evidence
          [[ "$APK_URL" == https://expo.dev/artifacts/eas/*.apk ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_SHA256" != 593099b7c23d420da0aa361d74d4760b6e73368089849a57887489e7cfb1a255 ]]
          [[ "$APK_SHA256" != 816f07a6d8563ebfb601be6810b564e6ebaeb49f865226ce2112f7635032884b ]]
          [[ "$APK_BYTES" =~ ^[1-9][0-9]{6,8}$ ]]
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --retry 2 "$APK_URL" -o rwadar.apk
          test "$(stat -c '%s' rwadar.apk)" = "$APK_BYTES"
          printf '%s  rwadar.apk\n' "$APK_SHA256" | sha256sum --check
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs rwadar.apk > evidence/signature.txt
          test "$(grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest:' evidence/signature.txt)" = 1
          grep -Fx "Signer #1 certificate SHA-256 digest: $CERT_SHA256" evidence/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging rwadar.apk > evidence/package.txt
          grep -F "package: name='com.rwadar.app' versionCode='14' versionName='1.3.1'" evidence/package.txt
          grep -Fx "sdkVersion:'24'" evidence/package.txt
          grep -Fx "targetSdkVersion:'36'" evidence/package.txt
          test "$(grep -c '^uses-permission:' evidence/package.txt)" = 4
          if grep -q '^uses-permission-sdk-' evidence/package.txt; then exit 1; fi
          grep '^uses-permission:' evidence/package.txt | grep -Ev "name='(android.permission.(INTERNET|ACCESS_NETWORK_STATE|VIBRATE)|com.rwadar.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)'" > evidence/unexpected-permissions.txt || true
          test ! -s evidence/unexpected-permissions.txt
          if grep -Eq "uses-permission:.*(SYSTEM_ALERT_WINDOW|RECEIVE_BOOT_COMPLETED|USE_BIOMETRIC|USE_FINGERPRINT|POST_NOTIFICATIONS|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)" evidence/package.txt; then
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree rwadar.apk AndroidManifest.xml > evidence/manifest.txt
          python3 - <<'PY'
          import pathlib, re
          manifest = pathlib.Path('evidence/manifest.txt').read_text(encoding='utf-8')
          assert re.search(r'android:allowBackup\([^)]*\)=\(type 0x12\)0x0\b', manifest), 'Backup must remain disabled'
          assert re.search(r'expo\.modules\.updates\.ENABLED[\s\S]{0,240}android:value\([^)]*\)=\(type 0x12\)0x0\b', manifest), 'Expo OTA must remain disabled'
          assert not re.search(r'android:(debuggable|usesCleartextTraffic)\([^)]*\)=\(type 0x12\)0xffffffff\b', manifest), 'No debug or cleartext-enabled APK'
          badging = pathlib.Path('evidence/package.txt').read_text(encoding='utf-8')
          permissions = re.findall(r"^uses-permission(?:-sdk-\d+)?: name='([^']+)'", badging, re.MULTILINE)
          expected = {'android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE',
                      'android.permission.VIBRATE', 'com.rwadar.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'}
          assert len(permissions) == 4 and set(permissions) == expected, 'Unexpected or duplicate manifest permissions'
          PY
          printf 'apk_url=%s\napk_sha256=%s\napk_bytes=%s\npublicar_release=%s\n' "$APK_URL" "$APK_SHA256" "$APK_BYTES" "$PUBLICAR_RELEASE" >> "$GITHUB_OUTPUT"
      - name: Prepare official Android emulator on an ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          printf '%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/rwadar-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          test -c /dev/kvm
          # Narrow grant on this disposable runner only; no account permission changes.
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          # Uses the runner's existing accepted SDK licences. Never auto-accept new terms.
          timeout 300 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'emulator' 'system-images;android-35;default;x86_64' < /dev/null
          command -v adb
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n rwadar_smoke -k 'system-images;android-35;default;x86_64' --device pixel_6 --path "$ANDROID_AVD_HOME/rwadar_smoke.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee evidence/avds.txt
          grep -Fx 'rwadar_smoke' evidence/avds.txt
          "$ANDROID_HOME/emulator/emulator" -avd rwadar_smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 2048 > evidence/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install --no-streaming rwadar.apk
      - name: Compile a disposable UI snapshot test harness, never modify the product APK
        shell: bash
        run: |
          set -euo pipefail
          # Stock uiautomator dump waits for idle and can leave a stale file on animated screens.
          # Use the documented Instrumentation/UiAutomation APIs to read the current tree directly.
          # This helper has no activity, network permission, product code, credentials or private key.
          mkdir -p ui-helper/classes ui-helper/dex
          python3 - <<'PY'
          from pathlib import Path
          Path('ui-helper/AndroidManifest.xml').write_text('''<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rwadar.smoketest">
            <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="35"/>
            <application android:label="RWAdar CI snapshot" android:allowBackup="false"/>
            <instrumentation android:name="com.rwadar.smoketest.DumpRunner" android:targetPackage="com.rwadar.smoketest"/>
          </manifest>''', encoding='utf-8')
          Path('ui-helper/DumpRunner.java').write_text(r'''package com.rwadar.smoketest;
          import android.app.Instrumentation;
          import android.app.UiAutomation;
          import android.graphics.Rect;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.util.Xml;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.io.StringWriter;
          import org.xmlpull.v1.XmlSerializer;
          public final class DumpRunner extends Instrumentation {
            @Override public void onCreate(Bundle args) { super.onCreate(args); start(); }
            private static String value(CharSequence value) { return value == null ? "" : value.toString(); }
            private static void node(XmlSerializer xml, AccessibilityNodeInfo info, int depth) throws Exception {
              if (depth > 100) throw new IllegalStateException("Hierarchy too deep");
              Rect bounds = new Rect(); info.getBoundsInScreen(bounds);
              xml.startTag(null, "node");
              xml.attribute(null, "text", value(info.getText()));
              xml.attribute(null, "content-desc", value(info.getContentDescription()));
              xml.attribute(null, "package", value(info.getPackageName()));
              xml.attribute(null, "class", value(info.getClassName()));
              xml.attribute(null, "clickable", Boolean.toString(info.isClickable()));
              xml.attribute(null, "enabled", Boolean.toString(info.isEnabled()));
              xml.attribute(null, "password", Boolean.toString(info.isPassword()));
              xml.attribute(null, "checkable", Boolean.toString(info.isCheckable()));
              xml.attribute(null, "checked", Boolean.toString(info.isChecked()));
              xml.attribute(null, "visible", Boolean.toString(info.isVisibleToUser()));
              xml.attribute(null, "bounds", "["+bounds.left+","+bounds.top+"]["+bounds.right+","+bounds.bottom+"]");
              for (int i=0; i<info.getChildCount(); i++) {
                AccessibilityNodeInfo child = info.getChild(i);
                if (child != null) { node(xml, child, depth+1); child.recycle(); }
              }
              xml.endTag(null, "node");
            }
            @Override public void onStart() {
              Bundle result = new Bundle();
              try {
                UiAutomation automation = getUiAutomation();
                AccessibilityNodeInfo root = null;
                long deadline = SystemClock.uptimeMillis()+5000;
                while (root == null && SystemClock.uptimeMillis() < deadline) {
                  root = automation.getRootInActiveWindow();
                  if (root == null) SystemClock.sleep(100);
                }
                if (root == null) throw new IllegalStateException("No active UI root");
                StringWriter writer = new StringWriter(); XmlSerializer xml = Xml.newSerializer();
                xml.setOutput(writer); xml.startDocument("UTF-8", true);
                xml.startTag(null, "hierarchy"); node(xml, root, 0); xml.endTag(null, "hierarchy");
                xml.endDocument(); root.recycle();
                result.putString("rwadar_ui", writer.toString()); finish(-1, result);
              } catch (Throwable error) {
                result.putString("rwadar_error", error.toString()); finish(1, result);
              }
            }
          }''', encoding='utf-8')
          PY
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          javac --release 8 -classpath "$ANDROID_JAR" -d ui-helper/classes ui-helper/DumpRunner.java
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 24 --output ui-helper/dex ui-helper/classes/com/rwadar/smoketest/DumpRunner.class
          "$BUILD_TOOLS/aapt" package -f -M ui-helper/AndroidManifest.xml -I "$ANDROID_JAR" -F ui-helper/unsigned.apk
          zip -j ui-helper/unsigned.apk ui-helper/dex/classes.dex
          "$BUILD_TOOLS/zipalign" -f 4 ui-helper/unsigned.apk ui-helper/aligned.apk
          keytool -genkeypair -keystore ui-helper/ephemeral.jks -storepass android -keypass android -alias test -dname 'CN=Disposable CI test only' -keyalg RSA -validity 1 -noprompt
          "$BUILD_TOOLS/apksigner" sign --ks ui-helper/ephemeral.jks --ks-pass pass:android --key-pass pass:android --out ui-helper/test.apk ui-helper/aligned.apk
          adb install --no-streaming ui-helper/test.apk
      - name: Verify public catalog, local favorite and optional account forms without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time, xml.etree.ElementTree as ET
          
          out = pathlib.Path('evidence')
          
          
          class TransientSnapshotError(Exception):
              pass
          
          
          def adb(*args, timeout=20):
              return subprocess.run(['adb', *args], check=True, capture_output=True, timeout=timeout).stdout.decode('utf-8', errors='replace')
          
          
          def dump_once(timeout=30):
              raw = adb('shell', 'am', 'instrument', '-w', '-r', 'com.rwadar.smoketest/.DumpRunner', timeout=timeout)
              out.joinpath('latest-ui-instrumentation.txt').write_text(raw, encoding='utf-8')
              marker = 'INSTRUMENTATION_RESULT: rwadar_ui='
              if marker not in raw and 'No active UI root' in raw:
                  raise TransientSnapshotError('UiAutomation has no active root during a window transition')
              assert marker in raw, 'Fresh UI snapshot failed: ' + raw[-1200:]
              xml = raw.split(marker, 1)[1].split('\nINSTRUMENTATION_', 1)[0].strip()
              root = ET.fromstring(xml)
              out.joinpath('latest-ui.xml').write_text(xml, encoding='utf-8')
              return root
          
          
          def dump(timeout=30):
              deadline = time.monotonic() + timeout
              while True:
                  try:
                      return dump_once(timeout=max(.1, deadline - time.monotonic()))
                  except TransientSnapshotError as error:
                      with out.joinpath('snapshot-errors.log').open('a', encoding='utf-8') as log:
                          log.write(str(error) + '\n')
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise
                      time.sleep(min(2, remaining))
          
          
          def visible_text(root):
              return '\n'.join(value for node in root.iter('node') if node.get('visible') != 'false' for value in [node.get('text', ''), node.get('content-desc', '')] if value)
          
          
          def wait_ui(*texts, timeout=75):
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  try:
                      root = dump(timeout=min(30, max(.1, deadline - time.monotonic())))
                      if all(text in visible_text(root) for text in texts):
                          return root
                  except (subprocess.SubprocessError, ET.ParseError, TransientSnapshotError) as error:
                      with out.joinpath('snapshot-errors.log').open('a', encoding='utf-8') as log:
                          log.write(str(error) + '\n')
                  time.sleep(2)
              raise AssertionError('Native UI did not visibly show: ' + ', '.join(texts))
          
          
          def screen(name, root=None):
              image = subprocess.run(['adb', 'exec-out', 'screencap', '-p'], check=True, capture_output=True, timeout=20).stdout
              assert image.startswith(b'\x89PNG'), 'Screenshot must be a real PNG'
              out.joinpath(name + '.png').write_bytes(image)
              if root is not None:
                  out.joinpath(name + '.xml').write_text(ET.tostring(root, encoding='unicode'), encoding='utf-8')
          
          
          def find_node(root, label, starts=False):
              candidates = []
              for node in root.iter('node'):
                  values = [node.get('content-desc', ''), node.get('text', '')]
                  if node.get('visible') != 'false' and any(v.startswith(label) if starts else v == label for v in values):
                      candidates.append(node)
              candidates.sort(key=lambda n: n.get('clickable') != 'true')
              for node in candidates:
                  bounds = list(map(int, re.findall(r'-?\d+', node.get('bounds', ''))))
                  if len(bounds) == 4 and bounds[2] > bounds[0] and bounds[3] > bounds[1]:
                      return node, bounds
              raise AssertionError('Accessible control not found: ' + label)
          
          
          def tap_observed(root, label, starts=False):
              node, bounds = find_node(root, label, starts)
              adb('shell', 'input', 'tap', str((bounds[0]+bounds[2])//2), str((bounds[1]+bounds[3])//2))
              return node
          
          
          def scroll_down():
              size = re.search(r'Physical size:\s*(\d+)x(\d+)', adb('shell', 'wm', 'size'))
              assert size, 'Need actual device dimensions for scrolling'
              width, height = map(int, size.groups())
              adb('shell', 'input', 'swipe', str(width//2), str(int(height*.80)), str(width//2), str(int(height*.32)), '450')
              time.sleep(.5)
          
          
          def document_detail(prefix, title, required, forbidden=(), inspect=None, scan_to_end=False):
              root = wait_ui('Cerrar ' + title)
              remaining = set(required)
              previous_text = None
              for index in range(40):
                  root = dump()
                  text = visible_text(root)
                  if inspect:
                      inspect(root)
                  assert not any(item in text for item in forbidden), 'Commercial claim in documentary detail: ' + text
                  newly = {item for item in remaining if item in text}
                  if newly or index == 0:
                      screen(prefix + '-%02d' % index, root)
                  remaining -= newly
                  if not remaining and (not scan_to_end or text == previous_text):
                      if scan_to_end:
                          screen(prefix + '-complete', root)
                      return root
                  previous_text = text
                  scroll_down()
              raise AssertionError('Missing visible documentary evidence: ' + ', '.join(sorted(remaining)))
          
          
          def search(root, query):
              tap_observed(root, 'Buscar ofertas por nombre, proveedor, país o métrica')
              adb('shell', 'input', 'text', query.replace(' ', '%s'))
              adb('shell', 'input', 'keyevent', 'KEYCODE_BACK')
              return wait_ui(query, '1 ficha')
          
          
          def assert_counts(root):
              text = visible_text(root)
              match = re.search(r'(\d+) principales · (\d+) secundarias · (\d+) en camino', text)
              assert match, 'Missing explicit V2 collection counts: ' + text
              counts = tuple(map(int, match.groups()))
              assert counts == (24, 21, 4), 'Partial or unexpected V2 catalog: ' + str(counts)
              assert '28 fichas' not in text and 'fixture local' not in text and 'copia sin conexión' not in text, 'Old/local/offline catalog must not pass'
              return {'principales': counts[0], 'secundario': counts[1], 'en_camino': counts[2]}


          def scroll_top():
              size = re.search(r'Physical size:\s*(\d+)x(\d+)', adb('shell', 'wm', 'size'))
              assert size, 'Need actual screen dimensions'
              width, height = map(int, size.groups())
              previous = None
              for _ in range(12):
                  current = visible_text(dump())
                  if current == previous:
                      return
                  previous = current
                  adb('shell', 'input', 'swipe', str(width//2), str(int(height*.32)), str(width//2), str(int(height*.80)), '350')
                  time.sleep(.3)
          
          
          def reach_control(label, starts=False):
              previous = None
              for _ in range(14):
                  root = dump()
                  try:
                      find_node(root, label, starts=starts)
                      return root
                  except AssertionError:
                      current = visible_text(root)
                      if current == previous:
                          break
                      previous = current
                      scroll_down()
              raise AssertionError('Control not reachable by native scrolling: ' + label)
          
          
          def assert_empty_field(root, label, password=False):
              candidates = [n for n in root.iter('node')
                            if n.get('visible') != 'false'
                            and n.get('class', '').endswith('EditText')
                            and n.get('content-desc') == label]
              assert candidates, 'Accessible native input missing: ' + label
              for field in candidates:
                  assert not field.get('text', ''), 'Smoke must never enter credentials or personal data'
                  assert field.get('enabled') == 'true', 'Input must be usable: ' + label
                  assert field.get('password') == str(password).lower(), 'Password masking mismatch: ' + label
          
          
          launch = adb('shell', 'am', 'start', '-W', '-n', 'com.rwadar.app/.MainActivity')
          out.joinpath('launch.txt').write_text(launch, encoding='utf-8')
          assert 'Status: ok' in launch, launch
          # Install the signed production candidate unchanged. No account credentials,
          # no acceptance of terms, no Auth submission and no remote SQL mutation.
          root = wait_ui('Plataformas de tokenización, con la fuente al lado', 'Noticias de RWAdar')
          for tab in ('Inicio', 'Buscar', 'Academy', 'Perfil'):
              find_node(root, tab)
          screen('01-inicio', root)
          tap_observed(root, 'Buscar')
          root = wait_ui('Explora lo verificado', '26 plataformas')
          screen('02-buscar-empresas', root)
          tap_observed(root, 'Mostrar ofertas', starts=True)
          root = wait_ui('Ofertas específicas', '24 principales · 21 secundarias · 4 en camino')
          collections = assert_counts(root)
          assert sum(collections.values()) == 49
          screen('03-buscar-ofertas', root)
          root = search(root, 'Spiko')
          node, _ = find_node(root, 'Ver ficha de Spiko Letras del Tesoro Euro.', starts=True)
          label = node.get('content-desc', '')
          out.joinpath('spiko-card.txt').write_text(label, encoding='utf-8')
          # Date-sensitive yields are not hardcoded: the complete public catalog
          # must stay available even when a revision expires.
          assert 'Spiko Letras del Tesoro Euro' in label, label
          screen('04-spiko-tarjeta', root)
          tap_observed(root, 'Ver ficha de Spiko Letras del Tesoro Euro.', starts=True)
          root = wait_ui('Cerrar Spiko Letras del Tesoro Euro')
          tap_observed(root, 'Guardar Spiko Letras del Tesoro Euro en Perfil')
          root = wait_ui('Quitar Spiko Letras del Tesoro Euro de guardadas')
          screen('05-favorito-local', root)
          root = document_detail('06-spiko-ficha', 'Spiko Letras del Tesoro Euro',
                                 ['FICHA DOCUMENTADA', 'FR001400ODL1', 'REFERENCIAS FECHADAS'])
          tap_observed(root, 'Cerrar Spiko Letras del Tesoro Euro')
          root = wait_ui('Ofertas específicas')
          tap_observed(root, 'Academy')
          root = wait_ui('de 7 lecciones leídas')
          screen('07-academy', root)
          root = reach_control('Lección 1:', starts=True)
          tap_observed(root, 'Lección 1:', starts=True)
          root = wait_ui('Lección 1 de', 'Volver a las lecciones')
          screen('07b-academy-leccion-real', root)
          tap_observed(root, 'Volver a las lecciones')
          root = wait_ui('de 7 lecciones leídas')
          tap_observed(root, 'Perfil')
          root = wait_ui('Entra en tu cuenta')
          assert_empty_field(root, 'Correo')
          assert_empty_field(root, 'Contraseña', password=True)
          screen('08-perfil-entrar', root)
          # The EMPTY login is rejected by local validation before the controller:
          # no actual email/password is entered or sent.
          root = reach_control('Entrar')
          tap_observed(root, 'Entrar')
          scroll_top()
          root = wait_ui('Escribe un correo válido.')
          screen('09-validacion-local-sin-credenciales', root)
          root = reach_control('Crear una cuenta gratis')
          tap_observed(root, 'Crear una cuenta gratis')
          scroll_top()
          root = wait_ui('Crea tu cuenta')
          assert_empty_field(root, 'Correo')
          root = reach_control('Contraseña · mínimo 12 caracteres')
          assert_empty_field(root, 'Contraseña · mínimo 12 caracteres', password=True)
          root = reach_control('Nombre (opcional)')
          assert_empty_field(root, 'Nombre (opcional)')
          root = reach_control('Acepto las condiciones y he leído la privacidad')
          consent, _ = find_node(root, 'Acepto las condiciones y he leído la privacidad')
          assert consent.get('checkable') == 'true' and consent.get('checked') == 'false', 'Terms must not be accepted by QA'
          screen('10-perfil-alta-sin-aceptacion', root)
          for control in ('Leer condiciones', 'Leer privacidad', 'Crear cuenta'):
              reach_control(control)
          # Do not press Crear cuenta, send recovery/confirmation, or open external
          # provider investment links. These forms are inspected only.
          root = reach_control('Volver a entrar')
          tap_observed(root, 'Volver a entrar')
          scroll_top()
          root = wait_ui('Entra en tu cuenta')
          root = reach_control('He olvidado la contraseña')
          tap_observed(root, 'He olvidado la contraseña')
          scroll_top()
          root = wait_ui('Recupera tu acceso')
          assert_empty_field(root, 'Correo')
          root = reach_control('Enviar enlace de recuperación')
          # Regression found during the APK13 visual review: the local-favorite
          # note must not invade the account card. Compare real native bounds
          # on the fixed Pixel6 emulator, not only a static style assertion.
          root = reach_control('Los siguientes favoritos se guardan solo', starts=True)
          _, return_bounds = find_node(root, 'Volver a entrar')
          _, note_bounds = find_node(root, 'Los siguientes favoritos se guardan solo', starts=True)
          note_gap_pixels = note_bounds[1] - return_bounds[3]
          assert note_gap_pixels >= 40, 'Local-favorite note overlaps account card: gap=' + str(note_gap_pixels)
          screen('11-recuperacion-sin-envio', root)
          root = reach_control('Volver a entrar')
          tap_observed(root, 'Volver a entrar')
          scroll_top()
          root = wait_ui('Entra en tu cuenta')
          root = reach_control('No he recibido la confirmación')
          tap_observed(root, 'No he recibido la confirmación')
          scroll_top()
          root = wait_ui('Confirma tu correo')
          root = reach_control('Correo para reenviar la confirmación')
          assert_empty_field(root, 'Correo para reenviar la confirmación')
          reach_control('Reenviar confirmación')
          screen('12-confirmacion-sin-reenvio', dump())
          root = reach_control('Ya confirmé: entrar')
          tap_observed(root, 'Ya confirmé: entrar')
          scroll_top()
          root = wait_ui('Entra en tu cuenta')
          root = reach_control('Ofertas guardadas · 1')
          screen('13-favorito-en-perfil', root)
          root = reach_control('Spiko Letras del Tesoro Euro.', starts=True)
          screen('14-oferta-guardada', root)
          tap_observed(root, 'Inicio')
          root = wait_ui('Noticias de RWAdar')
          screen('15-vuelta-a-inicio', root)
          tap_observed(root, 'Perfil')
          scroll_top()
          root = wait_ui('Entra en tu cuenta')
          assert '1 guardado en este dispositivo' in visible_text(root), 'Singular favorite heading must be correct'
          assert_empty_field(root, 'Correo')
          assert_empty_field(root, 'Contraseña', password=True)
          screen('16-perfil-reabierto', root)
          # Local favorites must survive a full process restart; accounts must
          # still be unauthenticated because the smoke never signed in.
          adb('shell', 'am', 'force-stop', 'com.rwadar.app')
          restart = adb('shell', 'am', 'start', '-W', '-n', 'com.rwadar.app/.MainActivity')
          assert 'Status: ok' in restart, restart
          root = wait_ui('Noticias de RWAdar')
          tap_observed(root, 'Perfil')
          root = wait_ui('Entra en tu cuenta')
          assert_empty_field(root, 'Correo')
          assert_empty_field(root, 'Contraseña', password=True)
          root = reach_control('Ofertas guardadas · 1')
          reach_control('Spiko Letras del Tesoro Euro.', starts=True)
          screen('17-favorito-tras-reinicio', dump())
          assert adb('shell', 'pidof', 'com.rwadar.app').strip(), 'App process must remain alive'
          logs = adb('logcat', '-d', '-v', 'threadtime', 'AndroidRuntime:E', 'ReactNativeJS:E', '*:S')
          out.joinpath('app-errors.log').write_text(logs, encoding='utf-8')
          assert 'FATAL EXCEPTION' not in logs, 'Android crash recorded'
          assert not re.search(r'ReactNativeJS.*(?:Error:|TypeError|ReferenceError|Invariant Violation)', logs), 'JavaScript error recorded'
          result = {'package':'com.rwadar.app', 'version':'1.3.1', 'versionCode':14,
                    'accountPanelNoteSeparated':True, 'accountPanelNoteGapPixels':note_gap_pixels,
                    'apkSha256':os.environ['APK_SHA256'], 'apkBytes':int(os.environ['APK_BYTES']),
                    'certificateSha256':os.environ['CERT_SHA256'], 'workflowSha':os.environ['WORKFLOW_SHA'],
                    'headSha':os.environ['HEAD_SHA'], 'runId':os.environ['RUN_ID'],
                    'androidApi':35, 'installation':True, 'launch':True,
                    'tabs':['Inicio', 'Buscar', 'Academy', 'Perfil'],
                    'visibleCatalogPlatforms':26, 'catalogSchemaVersion':2, 'collections':collections,
                    'spikoDocumentaryDetail':True, 'academyLessons':7,
                    'localFavoritePersistsAfterRestart':True,
                    'accountForms':['login', 'signup', 'recovery', 'confirmation'],
                    'emptyLoginValidation':True, 'passwordInputsMasked':True,
                    'credentialsEntered':False, 'termsAccepted':False,
                    'authEndToEndTested':False, 'smtpTested':False,
                    'physicalDevice':False, 'scope':'Signed APK on Android API35 emulator; no actual account creation/login/deletion'}
          out.joinpath('result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result))
          PY
      - name: Capture final emulator state and stop the disposable device
        if: always()
        shell: bash
        run: |
          if adb get-state >/dev/null 2>&1; then
            adb exec-out screencap -p > evidence/final-state.png || true
            adb logcat -d -v threadtime AndroidRuntime:E ReactNativeJS:E '*:S' > evidence/final-errors.log || true
            adb shell dumpsys webviewupdate > evidence/webview-provider.txt || true
            adb logcat -d -v threadtime chromium:E cr_WebViewFactory:E '*:S' > evidence/webview-errors.log || true
            adb emu kill || true
          fi
      - name: Publish bounded evidence in free job logs, never Actions artifact storage
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, zipfile
          folder = pathlib.Path('evidence')
          assert folder.is_dir(), 'No evidence directory: nothing to publish'
          limit_zip = 12 * 1024 * 1024
          limit_total = 24 * 1024 * 1024
          total = 0
          contents = []
          for path in sorted(folder.iterdir()):
              if not path.is_file() or path.is_symlink():
                  continue
              assert re.fullmatch(r'[A-Za-z0-9_.-]+', path.name), 'Unsafe evidence name'
              assert path.suffix in {'.png', '.xml', '.json', '.txt', '.log'}, 'Unexpected evidence file'
              data = path.read_bytes()
              if path.suffix == '.log':
                  data = data[-128 * 1024:]  # Last errors only; no unbounded emulator log.
              assert len(data) <= 4 * 1024 * 1024, 'Evidence file unexpectedly large'
              total += len(data)
              assert total <= limit_total, 'Evidence collection exceeds bounded budget'
              contents.append((path.name, data))
          assert contents, 'No test evidence'
          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name, data in contents:
                  archive.writestr('evidence/' + name, data)
          payload = buffer.getvalue()
          assert 0 < len(payload) <= limit_zip, 'Evidence ZIP exceeds 12 MiB; do not silently truncate'
          digest = hashlib.sha256(payload).hexdigest()
          encoded = base64.b64encode(payload).decode('ascii')
          chunks = [encoded[i:i+1024] for i in range(0, len(encoded), 1024)]
          print(f'RWADAR_QA_ZIP_META {digest} {len(payload)} {len(chunks)}', flush=True)
          for index, chunk in enumerate(chunks):
              print(f'RWADAR_QA_ZIP_DATA {index:06d} {chunk}')
          print('RWADAR_QA_ZIP_END', flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'evidence_sha256={digest}\nevidence_bytes={len(payload)}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'## Native APK QA evidence\nZIP SHA-256: {digest}\n\nZIP bytes: {len(payload)}.\n')
              summary.write('Evidence is encoded in numbered job-log lines; no upload-artifact or cache storage.\n')
              if folder.joinpath('result.json').exists():
                  summary.write('\n```json\n' + folder.joinpath('result.json').read_text() + '\n```\n')
          PY
  release:
    name: Publish the SAME verified APK only after QA passes and explicit SI
    needs: android
    if: ${{ needs.android.result == 'success' && needs.android.outputs.publicar_release == 'SI' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job can write a public release. No additional PAT or secret.
    permissions:
      contents: write
      actions: read
    env:
      APK_URL: ${{ needs.android.outputs.apk_url }}
      APK_SHA256: ${{ needs.android.outputs.apk_sha256 }}
      APK_BYTES: ${{ needs.android.outputs.apk_bytes }}
      PUBLICAR_RELEASE: ${{ needs.android.outputs.publicar_release }}
      EVIDENCE_SHA256: ${{ needs.android.outputs.evidence_sha256 }}
      EVIDENCE_BYTES: ${{ needs.android.outputs.evidence_bytes }}
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Re-download and verify the byte-identical APK that passed the emulator
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = victorJorques/RWAdar-downloads
          test "$GITHUB_REF" = refs/heads/codex/android-131-release
          test "$PUBLICAR_RELEASE" = SI
          test "$RELEASE_TAG" = v1.3.1
          [[ "$APK_URL" == https://expo.dev/artifacts/eas/*.apk ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_BYTES" =~ ^[1-9][0-9]{6,8}$ ]]
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --retry 2 "$APK_URL" -o RWAdar.apk
          test "$(stat -c '%s' RWAdar.apk)" = "$APK_BYTES"
          printf '%s  RWAdar.apk\n' "$APK_SHA256" | sha256sum --check
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs RWAdar.apk > signature.txt
          test "$(grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest:' signature.txt)" = 1
          grep -Fx "Signer #1 certificate SHA-256 digest: $CERT_SHA256" signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging RWAdar.apk > package.txt
          grep -F "package: name='com.rwadar.app' versionCode='14' versionName='1.3.1'" package.txt
          printf '%s  RWAdar.apk\n' "$APK_SHA256" > SHA256SUMS.txt
      - name: Recover exact QA evidence from its completed job logs before any release write
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EVIDENCE_BYTES" =~ ^[1-9][0-9]{0,7}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > qa-jobs.json
          job_id="$(python3 - <<'PY'
          import json, os, pathlib
          jobs = json.loads(pathlib.Path('qa-jobs.json').read_text())['jobs']
          matches = [job for job in jobs if job['name'] == 'android'
                     and str(job['run_id']) == os.environ['RUN_ID']
                     and job['head_sha'] == os.environ['HEAD_SHA']
                     and job['status'] == 'completed' and job['conclusion'] == 'success']
          assert len(matches) == 1, 'Need exactly one successful QA job for THIS run attempt'
          print(matches[0]['id'])
          PY
          )"
          # Completed job logs can take a little time to become downloadable.
          ready=NO
          for attempt in 1 2 3 4 5 6; do
            if gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > qa-job.log; then
              ready=SI
              break
            fi
            sleep 10
          done
          test "$ready" = SI
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, zipfile
          # GitHub concatenates log blocks with UTF-8 BOMs; these are transport,
          # never base64 data. Exact size, sequence, SHA and ZIP CRC remain required.
          log = pathlib.Path('qa-job.log').read_text(encoding='utf-8').replace('\ufeff', '')
          # Anchor after the optional GitHub ISO timestamp. Echoed script source
          # cannot be mistaken for emitted lines, and sequence/size/hash are exact.
          prefix = r'^(?:\d{4}-\d{2}-\d{2}T[^ ]+ )?'
          metadata = re.findall(prefix + r'RWADAR_QA_ZIP_META ([a-f0-9]{64}) (\d+) (\d+)$', log, re.MULTILINE)
          chunks = re.findall(prefix + r'RWADAR_QA_ZIP_DATA (\d{6}) ([A-Za-z0-9+/=]+)$', log, re.MULTILINE)
          endings = re.findall(prefix + r'RWADAR_QA_ZIP_END$', log, re.MULTILINE)
          assert len(metadata) == 1 and len(endings) == 1, 'Missing/duplicate evidence markers'
          digest, size, count = metadata[0]
          assert digest == os.environ['EVIDENCE_SHA256'] and int(size) == int(os.environ['EVIDENCE_BYTES'])
          assert 0 < int(size) <= 12 * 1024 * 1024 and len(chunks) == int(count)
          assert [int(index) for index, _ in chunks] == list(range(int(count))), 'Incomplete/out-of-order ZIP chunks'
          payload = base64.b64decode(''.join(chunk for _, chunk in chunks), validate=True)
          assert len(payload) == int(size) and hashlib.sha256(payload).hexdigest() == digest, 'Evidence ZIP identity mismatch'
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              files = archive.infolist()
              assert 0 < len(files) <= 200
              assert all(re.fullmatch(r'evidence/[A-Za-z0-9_.-]+\.(?:png|xml|json|txt|log)', f.filename) for f in files)
              assert sum(f.file_size for f in files) <= 24 * 1024 * 1024 and all(f.file_size <= 4 * 1024 * 1024 for f in files)
              assert archive.testzip() is None, 'ZIP CRC failure'
              result = json.loads(archive.read('evidence/result.json'))
          assert result['version'] == '1.3.1' and result['versionCode'] == 14
          assert result['apkSha256'] == os.environ['APK_SHA256'] and result['apkBytes'] == int(os.environ['APK_BYTES'])
          assert result['certificateSha256'] == os.environ['CERT_SHA256']
          assert result['headSha'] == os.environ['HEAD_SHA'] and str(result['runId']) == os.environ['RUN_ID']
          assert result['installation'] and result['launch'] and result['localFavoritePersistsAfterRestart']
          assert result['emptyLoginValidation'] and result['passwordInputsMasked']
          assert result['accountPanelNoteSeparated'] and result['accountPanelNoteGapPixels'] >= 40
          assert result['credentialsEntered'] is False and result['termsAccepted'] is False
          assert result['authEndToEndTested'] is False and result['smtpTested'] is False and result['physicalDevice'] is False
          pathlib.Path('rwadar-android-131-evidence.zip').write_bytes(payload)
          PY
          printf '%s  rwadar-android-131-evidence.zip\n' "$EVIDENCE_SHA256" >> SHA256SUMS.txt
      - name: Create a new draft without replacing any existing release
        shell: bash
        run: |
          set -euo pipefail
          # Any existing tag release or ambiguous API response stops publication.
          status="$(curl --silent --show-error --proto '=https' --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output existing-release.json --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$status" = 404
          python3 - <<'PY'
          import os, pathlib
          note = f"""RWAdar 1.3.1 · Android (versionCode 14)

          Revisión de acabado: separa la nota de favoritos del panel de cuentas
          y corrige la cabecera singular «1 guardado». No cambia el motor de cuentas.

          Catálogo público sin registro obligatorio: 26 plataformas y 49 referencias.
          Cuentas gratuitas y opcionales, compartidas con la web. La confirmación y
          recuperación por correo se abren en la web; después vuelve a entrar en la app.
          Sesión solo en memoria. Favoritos y Academy permanecen en el dispositivo.
          Publicidad, cobros y avisos push siguen desactivados.

          SHA-256 del APK: {os.environ['APK_SHA256']}
          Certificado SHA-256: {os.environ['CERT_SHA256']}
          Tamaño: {os.environ['APK_BYTES']} bytes.
          Verificación del APK exacto en emulador Android API35:
          https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}

          Alcance: instalación, arranque, catálogo, navegación, favorito local persistente
          y formularios de cuentas sin credenciales. Este smoke NO prueba creación/inicio
          de sesión real, SMTP, recuperación efectiva ni un dispositivo físico.
          """
          pathlib.Path('release-notes.txt').write_text(note, encoding='utf-8')
          PY
          gh release create "$RELEASE_TAG" RWAdar.apk SHA256SUMS.txt rwadar-android-131-evidence.zip \
            --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" \
            --title 'RWAdar 1.3.1 · Android' --notes-file release-notes.txt --draft --latest=false
      - name: Verify the uploaded draft assets before making them public
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > draft-metadata.json
          python3 - <<'PY'
          import json, os, pathlib
          release = json.loads(pathlib.Path('draft-metadata.json').read_text())
          assert release['tagName'] == 'v1.3.1' and release['isDraft'] is True
          assert release['isPrerelease'] is False
          assets = {asset['name']: asset for asset in release['assets']}
          assert set(assets) == {'RWAdar.apk', 'SHA256SUMS.txt', 'rwadar-android-131-evidence.zip'}
          assert assets['RWAdar.apk']['size'] == int(os.environ['APK_BYTES'])
          assert assets['rwadar-android-131-evidence.zip']['size'] == int(os.environ['EVIDENCE_BYTES'])
          PY
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir release-readback --pattern RWAdar.apk --pattern SHA256SUMS.txt --pattern rwadar-android-131-evidence.zip
          test "$(stat -c '%s' release-readback/RWAdar.apk)" = "$APK_BYTES"
          printf '%s  release-readback/RWAdar.apk\n' "$APK_SHA256" | sha256sum --check
          cmp SHA256SUMS.txt release-readback/SHA256SUMS.txt
          test "$(stat -c '%s' release-readback/rwadar-android-131-evidence.zip)" = "$EVIDENCE_BYTES"
          printf '%s  release-readback/rwadar-android-131-evidence.zip\n' "$EVIDENCE_SHA256" | sha256sum --check
          # From this line onward publication is the explicit authorised action.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=true
      - name: Verify anonymous public release and permanent download links
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --proto '=https' --max-time 30 --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" -o public-release.json
          python3 - <<'PY'
          import json, os, pathlib
          release = json.loads(pathlib.Path('public-release.json').read_text())
          assert release['tag_name'] == 'v1.3.1' and not release['draft'] and not release['prerelease']
          assets = {asset['name']: asset for asset in release['assets']}
          assert set(assets) == {'RWAdar.apk', 'SHA256SUMS.txt', 'rwadar-android-131-evidence.zip'}
          assert assets['RWAdar.apk']['size'] == int(os.environ['APK_BYTES'])
          assert assets['rwadar-android-131-evidence.zip']['size'] == int(os.environ['EVIDENCE_BYTES'])
          PY
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --retry 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/RWAdar.apk" -o public-readback.apk
          test "$(stat -c '%s' public-readback.apk)" = "$APK_BYTES"
          printf '%s  public-readback.apk\n' "$APK_SHA256" | sha256sum --check
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 --retry 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/rwadar-android-131-evidence.zip" -o public-evidence.zip
          test "$(stat -c '%s' public-evidence.zip)" = "$EVIDENCE_BYTES"
          printf '%s  public-evidence.zip\n' "$EVIDENCE_SHA256" | sha256sum --check
          printf 'Public verified release: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
